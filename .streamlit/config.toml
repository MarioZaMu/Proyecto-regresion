# Tema claro/oscuro coherente (sigue la preferencia del sistema)
[theme]
base = "light"
font = "sans serif"

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F2FF"
textColor = "#1E1B4B"

[theme.dark]
primaryColor = "#818CF8"
backgroundColor = "#0B1020"
secondaryBackgroundColor = "#151A33"
textColor = "#E2E8F0"

[server]
headless = true

[browser]
gatherUsageStats = false
