# Tema claro/oscuro coherente (sigue la preferencia del sistema; paleta de 3-4 colores)
[theme]
base = "light"
font = "sans serif"

[theme.light]
primaryColor = "#1F5FBF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F9"
textColor = "#1F2937"

[theme.dark]
primaryColor = "#5B9BF0"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1F2B"
textColor = "#E5E7EB"

[server]
headless = true

[browser]
gatherUsageStats = false
